# Fork-specific test gate. Real-DB repo tests fall back to SQLite in a
# per-package temp dir when TEST_DB_DRIVER is unset, so no service
# containers are needed.

name: Test Fork

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: answer
          POSTGRES_PASSWORD: answer
          POSTGRES_DB: answer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U answer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the Postgres migration tests (internal/migrations); the
      # database is wiped by the tests.
      ANSWER_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=answer password=answer dbname=answer sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
